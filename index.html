<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SplitEase</title><meta name="theme-color" content="#0f9d75">
<link rel="manifest" href="manifest.webmanifest?v=2"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--g:#0f9d75;--bg:#f5f7f6;--card:#fff;--t:#1b2420;--m:#6b7a73;--r:#d9534f;--b:#e3e8e5}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2421;--t:#e8efec;--m:#8fa199;--b:#2b3631}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:14px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}.btn.h{background:transparent;color:#fff;padding:6px 8px}.btn.d{background:transparent;color:var(--r);padding:6px}
.card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card .g{flex:1;min-width:0}.m{color:var(--m);font-size:14px}.pos{color:var(--g)}.neg{color:var(--r)}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--b);position:sticky;top:52px;z-index:4}
.tabs button{flex:1;border:0;background:none;padding:12px;border-bottom:3px solid transparent;cursor:pointer}.tabs .on{border-color:var(--g);color:var(--g);font-weight:600}
.fab{position:fixed;right:16px;bottom:20px;border-radius:28px;padding:14px 20px;box-shadow:0 4px 12px #0004}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal>div{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}
label.r{display:flex;align-items:center;gap:8px;margin:6px 0}label.r input{width:auto;margin:0}label.r span{flex:1}label.r input[type=number]{width:110px}
.row{display:flex;gap:8px}.row>*{flex:1}.err{color:var(--r);font-size:14px;min-height:18px}
</style></head><body>
<header id="hd"></header><div id="tabs"></div><main id="app"></main><div id="fabw"></div><div id="md"></div><div id="inst"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import {getFirestore, doc, collection, setDoc, getDoc, updateDoc, arrayUnion, addDoc, deleteDoc, onSnapshot, query, orderBy}
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import {firebaseConfig} from "./config.js";

/* ---------- money logic (all amounts in paise) ---------- */
const inr = p => (p < 0 ? "-" : "") + "₹" + (Math.abs(p) / 100).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 8);
function splitEqual(amount, ids) { const b = Math.floor(amount / ids.length), x = amount % ids.length; return Object.fromEntries(ids.map((id, i) => [id, b + (i < x ? 1 : 0)])); }
function netBalances(members, expenses, settlements) {
  const n = Object.fromEntries(members.map(m => [m.id, 0]));
  expenses.forEach(e => { n[e.paidBy] = (n[e.paidBy] || 0) + e.amount; Object.entries(e.split).forEach(([m, a]) => n[m] = (n[m] || 0) - a); });
  settlements.forEach(s => { n[s.payer] = (n[s.payer] || 0) + s.amount; n[s.payee] = (n[s.payee] || 0) - s.amount; });
  return n;
}
// Simplify debts: match biggest debtor with biggest creditor -> at most (people-1) payments.
function simplifyDebts(net) {
  const D = [], C = [];
  Object.entries(net).forEach(([id, v]) => { if (v < 0) D.push([id, -v]); else if (v > 0) C.push([id, v]); });
  const out = [], s = a => a.sort((x, y) => y[1] - x[1]);
  while (D.length && C.length) {
    s(D); s(C); const [d, o] = D.shift(), [c, u] = C.shift(), p = Math.min(o, u);
    out.push({from: d, to: c, amount: p}); if (o > p) D.push([d, o - p]); if (u > p) C.push([c, u - p]);
  }
  return out;
}
function pairwiseDebts(expenses, settlements) {
  const m = {}; const add = (a, b, x) => { const rk = b + ">" + a, k = a + ">" + b;
    if (m[rk] != null) { const l = m[rk] - x; if (l > 0) m[rk] = l; else { delete m[rk]; if (l < 0) m[k] = -l; } } else m[k] = (m[k] || 0) + x; };
  expenses.forEach(e => Object.entries(e.split).forEach(([mid, a]) => { if (mid !== e.paidBy) add(mid, e.paidBy, a); }));
  settlements.forEach(s => add(s.payee, s.payer, s.amount));
  return Object.entries(m).filter(([, v]) => v > 0).map(([k, v]) => { const [from, to] = k.split(">"); return {from, to, amount: v}; });
}

/* ---------- firebase ---------- */
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const ready = signInAnonymously(auth);
const ls = {get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v))};

/* ---------- state & rendering ---------- */
const S = {gid: null, group: null, expenses: [], settlements: [], tab: 0, simplify: true, unsub: []};
const $ = id => document.getElementById(id);
const nameOf = id => (S.group?.members.find(m => m.id === id)?.name) || "?";
const me = () => ls.get("me:" + S.gid, null);
const link = gid => location.origin + location.pathname + "?g=" + gid;

function home() {
  S.unsub.forEach(u => u()); S.unsub = []; S.gid = null; history.replaceState(null, "", location.pathname);
  const gs = ls.get("groups", []);
  $("hd").innerHTML = "<h1>SplitEase</h1>"; $("tabs").innerHTML = ""; $("md").innerHTML = "";
  $("app").innerHTML = (gs.length ? gs.map(g => `<div class="card" data-act="open" data-id="${g.id}"><div class="g"><b>${esc(g.name)}</b></div>›</div>`).join("")
    : `<p class="m">No groups yet. Create one, or join a friend's group with their link or code.</p>`) +
    `<div class="row"><button class="btn" data-act="new">+ New group</button><button class="btn o" data-act="join">Join group</button></div>`;
  $("fabw").innerHTML = "";
}
function listen(gid) {
  S.gid = gid; S.unsub.forEach(u => u()); S.unsub = [];
  const g = doc(db, "groups", gid);
  S.unsub.push(onSnapshot(g, s => {
    if (!s.exists()) { alert("Group not found"); return home(); }
    S.group = {id: gid, ...s.data()};
    const gs = ls.get("groups", []).filter(x => x.id !== gid); gs.unshift({id: gid, name: S.group.name}); ls.set("groups", gs);
    if (!me()) return pickMe(); render();
  }, e => alert("Cannot open group: " + e.message)));
  S.unsub.push(onSnapshot(query(collection(g, "expenses"), orderBy("date", "desc")), s => { S.expenses = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }));
  S.unsub.push(onSnapshot(collection(g, "settlements"), s => { S.settlements = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }));
  history.replaceState(null, "", "?g=" + gid);
}
function render() {
  if (!S.group || !me()) return;
  const G = S.group, net = netBalances(G.members, S.expenses, S.settlements);
  const tr = S.simplify ? simplifyDebts(net) : pairwiseDebts(S.expenses, S.settlements);
  $("hd").innerHTML = `<button class="btn h" data-act="home">←</button><h1>${esc(G.name)}</h1><button class="btn h" data-act="addp">+Person</button><button class="btn h" data-act="share">Share</button>`;
  $("tabs").innerHTML = `<div class="tabs">${["Expenses", "Balances", "Settle up"].map((t, i) => `<button class="${S.tab === i ? "on" : ""}" data-act="tab" data-id="${i}">${t}</button>`).join("")}</div>`;
  let h = "";
  if (S.tab === 0) h = S.expenses.length ? S.expenses.map(e => `<div class="card"><div class="g"><b>${esc(e.title)}</b><div class="m">${nameOf(e.paidBy)} paid · ${new Date(e.date).toLocaleDateString()}</div></div><b>${inr(e.amount)}</b><button class="btn d" data-act="del" data-id="${e.id}">✕</button></div>`).join("") : `<p class="m">No expenses yet. Tap “+ Expense”.</p>`;
  else if (S.tab === 1) h = G.members.map(m => { const b = net[m.id] || 0; return `<div class="card"><div class="g">${esc(m.name)}${m.id === me() ? " (you)" : ""}</div><b class="${b >= 0 ? "pos" : "neg"}">${b > 0 ? "gets back " + inr(b) : b < 0 ? "owes " + inr(-b) : "settled up"}</b></div>`; }).join("");
  else h = `<label class="r"><span><b>Simplify debts</b><div class="m">Fewest possible payments</div></span><input type="checkbox" data-act="simp" ${S.simplify ? "checked" : ""}></label>` +
    (tr.length ? tr.map((t, i) => `<div class="card"><div class="g">${esc(nameOf(t.from))} → ${esc(nameOf(t.to))}<div><b>${inr(t.amount)}</b></div></div><button class="btn" data-act="settle" data-id="${i}">Record payment</button></div>`).join("") : `<p>Everyone is settled up 🎉</p>`);
  $("app").innerHTML = h; window._tr = tr;
  $("fabw").innerHTML = S.tab === 0 ? `<button class="btn fab" data-act="addx">+ Expense</button>` : "";
}
const modal = html => { $("md").innerHTML = `<div class="modal" data-act="close"><div>${html}</div></div>`; };
const close = () => $("md").innerHTML = "";

function pickMe() {
  modal(`<h3>Who are you in “${esc(S.group.name)}”?</h3>${S.group.members.map(m => `<div class="card" data-act="iam" data-id="${m.id}">${esc(m.name)}</div>`).join("")}
    <p class="m">Not listed?</p><input id="nn" placeholder="Your name"><button class="btn" data-act="iamnew">Join as new member</button>`);
}
function expenseForm() {
  const M = S.group.members;
  modal(`<h3>Add expense</h3><input id="t" placeholder="Description"><input id="a" type="number" inputmode="decimal" placeholder="Amount (₹)">
    <label>Paid by</label><select id="p">${M.map(m => `<option value="${m.id}" ${m.id === me() ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
    <label>Split</label><select id="mode"><option value="eq">Equally</option><option value="ex">By exact amounts</option></select>
    <div id="who">${M.map(m => `<label class="r"><input type="checkbox" data-w="${m.id}" checked><span>${esc(m.name)}</span><input type="number" inputmode="decimal" data-x="${m.id}" placeholder="₹" style="display:none"></label>`).join("")}</div>
    <div class="err" id="err"></div><div class="row"><button class="btn o" data-act="close">Cancel</button><button class="btn" data-act="savex">Save</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener("change", e => {
  if (e.target.dataset.act === "simp") { S.simplify = e.target.checked; render(); }
  if (e.target.id === "mode") document.querySelectorAll("[data-x]").forEach(i => i.style.display = e.target.value === "ex" ? "" : "none");
});
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close" && e.target !== el && !e.target.closest("button")) return; // ignore clicks inside sheet
  try {
    if (act === "close") close();
    else if (act === "home") home();
    else if (act === "install") { window._ip.prompt(); await window._ip.userChoice; $("inst").innerHTML = ""; }
    else if (act === "open") listen(id);
    else if (act === "tab") { S.tab = +id; render(); }
    else if (act === "new") modal(`<h3>New group</h3><input id="gn" placeholder="Group name (e.g. Goa Trip)"><input id="yn" placeholder="Your name"><input id="fr" placeholder="Friends, comma separated (optional)">
      <div class="row"><button class="btn o" data-act="close">Cancel</button><button class="btn" data-act="create">Create</button></div>`);
    else if (act === "create") {
      const name = $("gn").value.trim(), you = $("yn").value.trim(); if (!name || !you) return;
      await ready; const ref = doc(collection(db, "groups"));
      const members = [you, ...$("fr").value.split(",").map(s => s.trim()).filter(Boolean)].map(n => ({id: rid(), name: n}));
      await setDoc(ref, {name, members, created: Date.now()}); ls.set("me:" + ref.id, members[0].id); close(); listen(ref.id);
    }
    else if (act === "join") modal(`<h3>Join group</h3><input id="code" placeholder="Paste invite link or code"><div class="row"><button class="btn o" data-act="close">Cancel</button><button class="btn" data-act="dojoin">Join</button></div>`);
    else if (act === "dojoin") { let c = $("code").value.trim(); try { c = new URL(c).searchParams.get("g") || c; } catch {} if (c) { close(); await ready; listen(c); } }
    else if (act === "iam") { ls.set("me:" + S.gid, id); close(); render(); }
    else if (act === "iamnew") { const n = $("nn").value.trim(); if (!n) return; const m = {id: rid(), name: n};
      await updateDoc(doc(db, "groups", S.gid), {members: arrayUnion(m)}); ls.set("me:" + S.gid, m.id); close(); }
    else if (act === "addp") modal(`<h3>Add person</h3><input id="nn" placeholder="Name"><div class="row"><button class="btn o" data-act="close">Cancel</button><button class="btn" data-act="doaddp">Add</button></div>`);
    else if (act === "doaddp") { const n = $("nn").value.trim(); if (n) { await updateDoc(doc(db, "groups", S.gid), {members: arrayUnion({id: rid(), name: n})}); close(); } }
    else if (act === "addx") expenseForm();
    else if (act === "savex") {
      const title = $("t").value.trim(), amount = Math.round(parseFloat($("a").value) * 100), paidBy = $("p").value, ex = $("mode").value === "ex";
      const ids = [...document.querySelectorAll("[data-w]")].filter(c => c.checked).map(c => c.dataset.w), err = m => $("err").textContent = m;
      if (!title || !(amount > 0)) return err("Enter a description and amount.");
      if (!ids.length) return err("Pick at least one person.");
      let split;
      if (ex) { split = {}; ids.forEach(i => split[i] = Math.round((parseFloat(document.querySelector(`[data-x="${i}"]`).value) || 0) * 100));
        const sum = Object.values(split).reduce((a, b) => a + b, 0); if (sum !== amount) return err(`Amounts add up to ${inr(sum)}, expected ${inr(amount)}.`); }
      else split = splitEqual(amount, ids);
      await addDoc(collection(db, "groups", S.gid, "expenses"), {title, amount, paidBy, split, date: Date.now()}); close();
    }
    else if (act === "del") { if (confirm("Delete this expense?")) await deleteDoc(doc(db, "groups", S.gid, "expenses", id)); }
    else if (act === "settle") { const t = window._tr[+id];
      if (confirm(`Record: ${nameOf(t.from)} paid ${nameOf(t.to)} ${inr(t.amount)}?`)) await addDoc(collection(db, "groups", S.gid, "settlements"), {payer: t.from, payee: t.to, amount: t.amount, date: Date.now()}); }
    else if (act === "share") {
      const net = netBalances(S.group.members, S.expenses, S.settlements), tr = simplifyDebts(net);
      const text = `SplitEase – ${S.group.name}\nTotal spent: ${inr(S.expenses.reduce((a, x) => a + x.amount, 0))}\n\nSettle up:\n` +
        (tr.length ? tr.map(t => `• ${nameOf(t.from)} pays ${nameOf(t.to)} ${inr(t.amount)}`).join("\n") : "All settled!") + `\n\nJoin & add expenses: ${link(S.gid)}`;
      if (navigator.share) navigator.share({title: "SplitEase", text}).catch(() => {}); else { await navigator.clipboard.writeText(text); alert("Copied to clipboard"); }
    }
  } catch (err) { alert("Something went wrong: " + err.message); }
});

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window._ip = e;
  $("inst").innerHTML = `<button class="btn" data-act="install" style="position:fixed;left:16px;bottom:20px;z-index:6">⬇ Install app</button>`; });
window.addEventListener("appinstalled", () => $("inst").innerHTML = "");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
const g0 = new URLSearchParams(location.search).get("g");
ready.then(() => g0 ? listen(g0) : home()).catch(e => { $("app").innerHTML = `<p class="neg">Firebase sign-in failed: ${esc(e.message)}<br>Check config.js and that Anonymous sign-in is enabled.</p>`; });
</script></body></html>
